openapi: 3.0.3
info:
  title: Notes
  version: 1.0.0
servers:
  - url: /
paths:
  /notes:
    get:
      operationId: listNotes
      summary: Lists the notes, or those that hold every word of a query.
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The notes, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Note"}
    post:
      operationId: createNote
      summary: Adds a note.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewNote"}
      responses:
        "201":
          description: The note, with its id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        "422":
          description: The note has no title.
components:
  schemas:
    NewNote:
      type: object
      required: [title]
      properties:
        title: {type: string}
        body: {type: string}
    Note:
      type: object
      required: [id, title, body]
      properties:
        id: {type: integer}
        title: {type: string}
        body: {type: string}
