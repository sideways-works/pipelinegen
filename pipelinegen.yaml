# pipelinegen's own CI, made by pipelinegen. Its suites: lint, the Go tests
# of the tool itself, the plugin proof, and the example's two suites, whose
# slices (example/calc, example/text, example/words) are slices here too.
# Every suite runs by drivers: its steps name them, and no task file or
# script of this repository runs a batch.

pipeline: pipelinegen

bazel:
  workspace: .

github:
  repository: sideways-works/pipelinegen
  token: github_token

concourse:
  url: https://concourse.home.simulevski.at
  team: sideways-works
  repository:
    uri: https://github.com/sideways-works/pipelinegen.git
    username: x-access-token
    password: ((github_token))
  planner:
    image: {repository: golang, tag: 1.27.1}
    # go-sbom and go-correlator type-check the module: its dependencies
    # must be in the planning job's module cache
    prepare: go mod download
    digest: sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
    bootstrap:
      release: {version: v0.4.0, sha256: e5f78f866acacf3d4a13d141fb86fd4981453004f14ce0e4cb301d896ef3f86b}
      bazelisk: {version: v1.30.0, sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8}
  include: ci/root.yml


plugins:
  - repository: https://github.com/sideways-works/pipelinegen-plugins
    with:
      # the go suite is bound by what each test file ran: go-sbom lists the
      # module's declarations, go-correlator binds the test files and reads
      # their coverage
      - name: go-sbom
        kind: sbom
        path: sbom/go
        release: {version: v0.4.0, sums: e12cb210141dda74d52c56e9d192a67cf735c244dffb687757f3348402cda71d}
        config: {modules: [.]}
      - name: go-correlator
        kind: correlator
        path: correlator/go
        release: {version: v0.4.0, sums: fa7fea22707363a40366dad3b6947cd8d0a427cadce9e0dbd3e4b6cda227a020}
        config: {modules: [.]}
      # the drivers that run the suites' steps (the command driver comes with
      # pipelinegen)
      - {name: go, kind: driver, path: driver/go, release: {version: v0.4.0, sums: 9a666c360d7f001477588e54823aa4b46df4117d853ec41e53c1d9b147a81887}}
      - {name: shell, kind: driver, path: driver/shell, release: {version: v0.4.0, sums: ccba3ad11a223e3f148f05afe010831766ba776c314caf8c2d797496b58231af}}
      - name: concourse
        kind: runner
        path: runner/concourse
        release: {version: v0.4.1, sums: d306919d672273d2c7af51db0a579e6254ad50c208a10bf2b0614ec2afc4a837}
        config:
          placement:
            # Every suite, and the checks, on the cloud workers: they stream
            # volumes to each other directly, so a task and the fetch of its
            # image may land on different workers of the pool.
            default: [cloud]
            # planning, reporting and the pipeline job run on untagged workers
            rules:
              - {for: pipeline, tags: []}
              - {for: planning, tags: []}
              - {for: bookkeeping, tags: []}

suites:
  lint:
    # two explicit slices: lint has no test files, and the commit subjects
    # (every change reaches them)
    tag: slice-pipelinegen-lint
    image: golang
    # the whole suite runs in under a minute: one batch, so one task, one
    # set-up and one batch's end a build
    parallel: 1
    params:
      GOFLAGS: -trimpath
      GOCACHE: "{cache}/go-build"
      GOMODCACHE: "{cache}/mod"
      # bazelisk's download of Bazel
      XDG_CACHE_HOME: "{cache}/xdg"
    steps:
      # golangci-lint at the version and checksum MODULE.bazel pins over
      # every package, with the repository's .golangci.yml, then
      # pipelinegen's own check of the tree (a git work tree at the tested
      # commit with its history). Bazel's output, with the pinned tools, stays
      # with the job at a path of its own, since Bazel names an output base
      # after the checkout's path, which changes between builds; its server
      # ends once the lint has started.
      - run: command
        take: ["//:lint"]
        with:
          each: [bazelisk, "--output_user_root={cache}/bazel/root", "--output_base={cache}/bazel/base", --max_idle_secs=5, run, "//tools:lint"]
      # the subjects of the commits the build brings
      - run: command
        take: ["//:subjects"]
        with: {each: [go, run, ./internal/commitmsg/cmd, new]}
  proof:
    # one explicit slice: planning a fixture through the released plugins
    # (ci/proof); outside the nightly only a change under
    # ci/proof or to the planning and recording code (//:proved) selects
    # it, and then it plans with the tool built from the commit
    tag: slice-pipelinegen-proof
    image: golang
    # the proof downloads the pinned private releases through the GitHub
    # API; the token reaches only its helper's Authorization header
    secrets: {batch: {GITHUB_TOKEN: github_token}}
    params:
      GOFLAGS: -trimpath
      # the Go build and module caches and Bazel's download stay with the
      # job; the fixture, its Bazel output root and its temporary
      # directories live in the step's work directory and go with the task
      GOCACHE: "{cache}/go-build"
      GOMODCACHE: "{cache}/gomod"
      XDG_CACHE_HOME: "{cache}/xdg"
      # "true" plans with each piece's newest release instead of the pins
      PROOF_NEWEST: ""
      # "source" plans with the tool built from the tested commit
      PROOF_TOOL: ""
      # how many workers plan the cases side by side, each with two Bazel
      # servers of its own (the plan's and the walk's), and each server's
      # Java heap: 3 workers hold at most 8 servers of 1 GB heap at once
      PROOF_WORKERS: "3"
      PROOF_BAZEL_HEAP: 1g
    steps:
      # the mode comes from the params above, PROOF_NEWEST or PROOF_TOOL
      - run: command
        with: {each: [go, run, ./ci/proof, "{work}/proof"]}
  go:
    tests: ["internal/**/*_test.go", "plugin/**/*_test.go"]
    owner: "//:code"
    # each test file runs when code it ran, or what that code needs,
    # changed; a test that runs the tool in a child process records the
    # child's code too (testenv.ExitChild)
    bind: recorded
    # code that runs only in a child its test kills is never recorded: those
    # files run in go-whole instead
    exclude: &killed-children
      - internal/gitssh/gitssh_test.go
      - internal/gitstore/storetest/daemon_test.go
      - internal/scratch/scratch_test.go
    extra_deps:
      # the example's tests read the example
      - tests: ["internal/example/*_test.go"]
        deps: ["//:example"]
      # the docs check reads every page, and the config's and commands' code
      - tests: ["internal/docscheck/*_test.go"]
        deps: ["//:docs", "//:code"]
      # the release tests build and run the release command
      - tests: ["internal/releasetest/*_test.go"]
        deps: ["//:release"]
    image: golang
    # Go's caches and the bazel-diff the tests fetch, kept with the job;
    # bazelisk comes first on PATH from the tools
    params: &go-params
      GOFLAGS: -trimpath
      GOCACHE: "{cache}/go-build"
      GOMODCACHE: "{cache}/mod"
      XDG_CACHE_HOME: "{cache}/xdg"
    # a package's files share one go test, each file with its own result
    # and recording; a file holding "//ci:race" runs alone under the race
    # detector, one holding "//ci:alone" alone. A file's limit is 60
    # minutes, a bundle's that times its files; the build cache stays
    # within 4 GB.
    steps: &go-steps
      - run: go
        batch: true
        with: {timeout: 60m, cover_tags: [pipelinegen_cover], cache_mb: 4096}
  go-whole:
    # test files whose code runs in a child process their test kills (the
    # key and scratch directories removed on a signal, a daemon that dies
    # with its test): a killed child writes no coverage, so these are bound
    # to all of the module's code and run on every change to it
    tests: *killed-children
    owner: "//:code"
    image: golang
    # the whole suite runs in under a minute: one batch, so one task, one
    # set-up and one batch's end a build
    parallel: 1
    params: *go-params
    steps: *go-steps
  unit:
    tests: ["example/**/*_test.sh"]
    owner: "//{dir}:{stem}"
    bind: graph
    # each file's test_ functions, each in a shell of its own
    image: busybox
    # the whole suite runs in under a minute: one batch, so one task, one
    # set-up and one batch's end a build
    parallel: 1
    steps:
      - run: shell
        with: {functions: test_}
  smoke:
    tests: ["example/**/*_smoke.sh"]
    owner: "//{dir}:{stem}"
    # graph until a released collector can take the running server's
    # coverage between slices; then recorded, as in the example's config
    bind: graph
    # the words server, built once per build of the suite and started once
    # per batch; each file's test_ functions run against it
    image: busybox
    # the whole suite runs in under a minute: one batch, so one task, one
    # set-up and one batch's end a build
    parallel: 1
    steps:
      - prepare: command
        image: golang
        with: {run: [go, build, -trimpath, -o, "{prepared}/bin/words", .], dir: example/words, env: {CGO_ENABLED: "0"}}
      - setup: command
        with:
          start: ["{prepared}/bin/words"]
          env: {ADDR: "127.0.0.1:8080"}
          ready: {http: "http://127.0.0.1:8080/healthz", seconds: 60}
          export: {WORDS: "http://127.0.0.1:8080"}
      - run: shell
        with: {functions: test_}

runs:
  main:
    # continuous: a build of a commit that is no longer the branch's newest
    # exits at once, so pushes minutes apart don't each run the suites
    trigger: {branch: main, continuous: true}
    compare: last_passed
    select: affected
    suites: {lint: {}, go: {}, go-whole: {}, unit: {}, smoke: {}, proof: {params: {PROOF_TOOL: source}}}
    record: true
  nightly:
    trigger:
      timer: {start: "3:00", stop: "4:00", location: Europe/Berlin}
      branch: main
    compare: none
    select: all
    suites: {lint: {}, go: {}, go-whole: {}, unit: {}, smoke: {}, proof: {}}
    record: true

  newest:
    # the plugin proof with each piece's newest release instead of the
    # pins; no branch rule requires its status, so a release that breaks
    # the proof's table shows here before anyone pins it
    trigger:
      timer: {start: "4:00", stop: "5:00", location: Europe/Berlin}
      branch: main
    compare: none
    select: all
    suites: {proof: {params: {PROOF_NEWEST: "true"}}}

everything_on:
  - MODULE.bazel
  - .bazelversion
  - REPO.bazel
  - ci/*
  - example/ci/**
  - example/MODULE.bazel
  - example/.bazelversion
  # the fixtures the Go tests read; Bazel ignores them (REPO.bazel)
  - "**/testdata/**"
  # the module's dependencies and the toolchain: every test links them
  - go.mod
  - go.sum
  - .tool-versions

untested:
  - paths: [MODULE.bazel, .bazelversion, REPO.bazel, "ci/*", "**/testdata/**"]
    reason: the build setup and the ignored fixture; a change to them runs every slice (everything_on)
  - paths: ["example-notes/**"]
    reason: the book's sample repository, a Bazel workspace of its own that this one ignores (REPO.bazel)
  - paths: ["ci/book/**"]
    reason: the check that the book shows what the tool prints; it runs the book's steps on example-notes
