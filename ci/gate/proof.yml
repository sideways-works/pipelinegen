# The proof on a CI worker, with the tool built from the branch and the
# plugins given as files.
#
#   fly -t <target> execute --include-ignored -c ci/gate/proof.yml -i source=. -i tools=<dir with bazelisk> \
#     -i plugins=<dir with go-sbom and go-correlator> [-i modproxy=<module proxy dir>]
platform: linux
image_resource:
  type: registry-image
  source: {repository: golang, tag: 1.27.1}
inputs:
  - name: source
  - name: tools
  - name: plugins
  # an optional local module proxy
  - name: modproxy
    optional: true
params:
  GOFLAGS: -trimpath
  # how many workers the proof plans with; its default when empty
  PROOF_WORKERS: ""
run:
  path: bash
  args:
    - -ec
    - |
      # the inputs belong to another user than the task; git must still read them
      git config --global --add safe.directory '*'
      if [ -d modproxy ]; then export GOPROXY="file://$PWD/modproxy,https://proxy.golang.org,direct" GONOSUMDB=github.com/sideways-works GOPRIVATE=; fi
      # bazelisk and whatever else the tools hold come first, for the proof's runs too
      export PATH="$PWD/tools:$PATH" PLUGINS="$PWD/plugins"
      cd source && exec bazelisk run //ci/proof -- --source "$PWD/../proof"
